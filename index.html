/* ---------- storage ----------
   Right now everything saves to this phone only (localStorage).
   The shared coach board plugs in HERE later — see docs/PROGRESS.md.
   Keys are prefixed so team data and personal data never collide.
------------------------------------------------------------------ */
const store = {
  async get(k, shared = false) {
    try {
      const v = localStorage.getItem((shared ? "team:" : "me:") + k);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  },
  async set(k, v, shared = false) {
    try {
      localStorage.setItem((shared ? "team:" : "me:") + k, JSON.stringify(v));
    } catch (e) {
      /* private browsing or full storage — app still runs, just won't remember */
    }
  },
};

/* ---------- time helpers ---------- */
const parseTime = (s) => {
  if (!s) return null;
  const t = String(s).trim();
  if (t.includes(":")) {
    const [m, sec] = t.split(":");
    const v = parseInt(m, 10) * 60 + parseFloat(sec);
    return isNaN(v) ? null : v;
  }
  const v = parseFloat(t);
  return isNaN(v) ? null : v;
};
const fmtTime = (v) => {
  if (v == null || isNaN(v)) return "—";
  if (v < 60) return v.toFixed(2);
  const m = Math.floor(v / 60);
  const s = v - m * 60;
  return `${m}:${s < 10 ? "0" : ""}${s.toFixed(2)}`;
};

const easyRunFor = (ev, phase) => {

    return ev === "e400"
      ? { text: "2 sets of 300m, 200m, 100m on the grass at about two thirds effort. 45 seconds between runs, 3 minutes between sets.", m: 1200 }

    return { text: EASY_RUN.e400.text + " 400 runners carry more of this than anyone — it's where your base comes from.", m: 2400 };
  return EASY_RUN[ev];
};

/* ---------- which sessions exist for this athlete ---------- */
const longSpeedKey = (ev) => (ev === "e400" ? "longspeed400" : "longspeed200");

function sessionOptions(ev, phase) {
  const out = ["starts", "topspeed"];
  if (ev !== "e100") out.push(longSpeedKey(ev));
  if (!(ev === "e400" && phase !== "comp")) out.push("speedend");
  if (phase === "gpp" || phase === "spp") out.push("hills", "resisted");
  return out;
}

const SPECIALS = {
  easy: { name: "Easy day", kind: "easy" },
  premeet: { name: "Pre-meet", kind: "light" },
  meet: { name: "Meet", kind: "meet" },
  off: { name: "Off", kind: "off" },
};

const nameOf = (id) => (LIB[id] ? LIB[id].name : SPECIALS[id] ? SPECIALS[id].name : "Not set");
const kindOf = (id) => (LIB[id] ? LIB[id].kind : SPECIALS[id] ? SPECIALS[id].kind : "off");

/* ---------- build one day's session ---------- */
function buildSession(id, event, phase) {
  if (id === "meet")
    return {
      name: "Meet day",
      kind: "meet",
      warm: WARM.meet,
      reps: [],
      after: [],
      why: "Everything this week was for the next minute or less. Warm up long, stay warm, and trust what you've done.",
    };
  if (id === "premeet")
    return {
      name: "Pre-meet",
      kind: "light",
      warm: WARM.premeet,
      reps: [
        { d: 30, label: "2 × 30m buildups", rest: "walk back" },
        { d: 20, label: "2 × starts out to 15m", rest: "3 minutes" },
      ],
      after: ["Nothing in the weight room. Hurdle mobility and go home."],
      volume: 100,
      why: "This is a rehearsal, not a workout. You want to leave the track feeling springy and a little bored.",
    };
  if (id === "off")
    return {
      name: "Off",
      kind: "off",
      warm: null,
      reps: [],
      after: [],
      why: "Rest is when you actually get faster. The work already happened — this is where it takes hold.",
    };
  if (id === "easy") {
    const r = easyRunFor(event, phase);
    return {
      name: "Easy day",
      kind: "easy",
      warm: WARM.easy,
      reps: [{ d: 100, label: r.text, rest: "short, on purpose" }],
      after: AFTER.easy,
      easyVolume: r.m,
      why:
        "Easy days are how you pay for hard days. Nothing here should feel like a workout — it's blood flow, technique, and staying loose.",
    };
  }
  const s = LIB[id];
  if (!s) return null;
  const reps = s.reps[phase] || s.reps.spp || s.reps.gpp;
  const volume = reps.reduce((sum, r) => {
    const m = r.label.match(/^(\d+)\s*×/);
    return sum + (m ? parseInt(m[1], 10) : 1) * r.d;
  }, 0);
  return { name: s.name, kind: "hard", warm: WARM.hard, reps, after: AFTER[phase] || AFTER.spp, volume, why: s.why };
}

/* ---------- default weeks ---------- */
const TEMPLATES = {
  gpp: ["hills", "easy", "resisted", "easy", "topspeed", "off", "off"],
  spp: ["starts", "easy", "topspeed", "easy", "speedend", "off", "off"],
  precomp: ["speedend", "easy", "starts", "easy", "premeet", "meet", "off"],
  comp: ["topspeed", "easy", "starts", "easy", "premeet", "meet", "off"],
  peak: ["topspeed", "easy", "easy", "easy", "premeet", "meet", "off"],
};
const defaultWeek = (event, phase) => {
  const opts = sessionOptions(event, phase);
  return TEMPLATES[phase].map((id) => {
    if (LIB[id] && !opts.includes(id)) {
      if (id === "speedend" && event === "e400") return longSpeedKey(event);
      return opts[0];
    }
    return id;
  });
};

/* ============================================================
   UI pieces
   ============================================================ */

function Crest({ logo, size = 38 }) {
  if (!logo) return null;
  return <img src={logo} alt="Wenatchee High School Panthers" className="crest" style={{ maxHeight: size }} />;
}

function LaneRow({ n, dist, label, rest, max }) {
  const w = Math.max(10, Math.min(100, (dist / max) * 100));
  return (
    <div className="lane">
      <div className="lane-num">{n}</div>
      <div className="lane-body">
        <p className="lane-label">{label}</p>
        <div className="lane-track">
          <span className="lane-fill" style={{ width: `${w}%` }} />
          <span className="lane-dist">{dist}m</span>
        </div>
        <p className="lane-rest">Rest {rest}</p>
      </div>
    </div>
  );
}

function SessionView({ s }) {
  if (!s) return null;
  const maxD = Math.max(120, ...s.reps.map((r) => r.d));
  return (
    <>
      {s.warm && (
        <section className="panel">
          <h3 className="h-sec">Warm up</h3>
          <p className="body">{s.warm}</p>
        </section>
      )}

      {s.reps.length > 0 && (
        <section className="panel">
          <h3 className="h-sec">On the track</h3>
          <div className="lanes">
            {s.reps.map((r, i) => (
              <LaneRow key={i} n={i + 1} dist={r.d} label={r.label} rest={r.rest} max={maxD} />
            ))}
          </div>
          {s.volume != null && (
            <div className="volume">
              <span className="volume-n">{s.volume}</span>
              <span className="volume-l">meters of full-speed running</span>
            </div>
          )}
          {s.easyVolume && (
            <div className="volume volume-low">
              <span className="volume-n">{s.easyVolume}</span>
              <span className="volume-l">easy meters — getting tired here is fine</span>
            </div>
          )}
        </section>
      )}

      {s.after.length > 0 && (
        <section className="panel">
          <h3 className="h-sec">After the track</h3>
          <ul className="list">
            {s.after.map((a, i) => (
              <li key={i}>{a}</li>
            ))}
          </ul>
        </section>
      )}

      <section className="panel panel-outline">
        <h3 className="h-sec">Why you're doing this</h3>
        <p className="body">{s.why}</p>
      </section>
    </>
  );
}

function SessionPicker({ event, phase, value, onPick }) {
  const opts = [...sessionOptions(event, phase), "easy", "premeet", "meet", "off"];
  return (
    <div className="chips">
      {opts.map((id) => (
        <button key={id} className={`chip ${value === id ? "on" : ""}`} onClick={() => onPick(id)}>
          {nameOf(id)}
        </button>
      ))}
    </div>
  );
}

/* ---------- Today ---------- */
function Today({ board, event, coach, setDay, setNote }) {
  const i = todayIndex();
  const id = board.plan[i];
  const s = buildSession(id, event, board.phase);
  const note = board.notes[i];
  const ev = EVENTS.find((e) => e.id === event);

  return (
    <div className="stack">
      <section className={`panel panel-purple hero hero-${kindOf(id)}`}>
        <div className="hero-top">
          <span className="hero-eyebrow">{DAYS[i]}</span>
          <span className="hero-eyebrow">{ev.full}</span>
        </div>
        <h2 className="hero-title">{s ? s.name : "Nothing posted yet"}</h2>
        <span className="hero-kind">
          {kindOf(id) === "hard" ? "Hard day" : kindOf(id) === "easy" ? "Easy day" : nameOf(id)}
        </span>
      </section>

      {note && (
        <section className="panel panel-note">
          <h3 className="h-sec">From coach</h3>
          <p className="body">{note}</p>
        </section>
      )}

      {coach && (
        <section className="panel panel-coach">
          <h3 className="h-sec">Change today</h3>
          <SessionPicker event={event} phase={board.phase} value={id} onPick={(v) => setDay(i, v)} />
          <input
            className="input input-note"
            placeholder="Note for the team — sprinklers on, meet moved, anything"
            value={note || ""}
            onChange={(e) => setNote(i, e.target.value)}
          />
        </section>
      )}

      <SessionView s={s} />

      {s && s.kind === "hard" && (
        <p className="fine">
          If something hurts rather than just aches, stop and tell a coach or the trainer. Pain is not a rep you push
          through.
        </p>
      )}
    </div>
  );
}

/* ---------- Week ---------- */
function Week({ board, event, coach, setDay, setNote, setPhase, resetWeek, logo, setLogo }) {
  const [open, setOpen] = useState(null);
  const i = todayIndex();

  return (
    <div className="stack">
      <section className="panel">
        <div className="row-head">
          <h3 className="h-sec">This week</h3>
          {coach && (
            <button className="btn-ghost" onClick={resetWeek}>
              Reset to usual week
            </button>
          )}
        </div>
        <div className="week">
          {DAYS.map((d, n) => {
            const id = board.plan[n];
            const isOpen = open === n;
            return (
              <div key={d} className={`day day-${kindOf(id)} ${n === i ? "day-today" : ""}`}>
                <button
                  className="day-main"
                  onClick={() => coach && setOpen(isOpen ? null : n)}
                  disabled={!coach}
                >
                  <span className="day-name">{d}</span>
                  <span className="day-body">
                    <span className="day-title">{nameOf(id)}</span>
                    {board.notes[n] && <span className="day-note">{board.notes[n]}</span>}
                  </span>
                  <span className="day-kind">
                    {kindOf(id) === "hard" ? "Hard" : kindOf(id) === "easy" ? "Easy" : nameOf(id)}
                  </span>
                </button>
                {coach && isOpen && (
                  <div className="day-edit">
                    <SessionPicker
                      event={event}
                      phase={board.phase}
                      value={id}
                      onPick={(v) => {
                        setDay(n, v);
                        setOpen(null);
                      }}
                    />
                    <input
                      className="input input-note"
                      placeholder={`Note for ${d}`}
                      value={board.notes[n] || ""}
                      onChange={(e) => setNote(n, e.target.value)}
                    />
                  </div>
                )}
              </div>
            );
          })}
        </div>
        {coach ? (
          <p className="note">Tap any day to change it. Everyone on the team sees the update.</p>
        ) : (
          <p className="fine">Coach posts this. If it changed today, it changed here too.</p>
        )}
      </section>

      {coach && (
        <section className="panel panel-coach">
          <h3 className="h-sec">Time of year</h3>
          <div className="phases">
            {PHASES.map((p) => (
              <button key={p.id} className={`phase ${board.phase === p.id ? "on" : ""}`} onClick={() => setPhase(p.id)}>
                <span className="phase-l">{p.label}</span>
                <span className="phase-w">{p.when}</span>
              </button>
            ))}
          </div>
          <p className="note">
            This sets how much and how hard every session runs. Changing it doesn't rewrite the week — use reset for
            that.
          </p>
        </section>
      )}

      <section className="panel panel-outline">
        <h3 className="h-sec">The two rules behind all of it</h3>
        <ol className="rules">
          <li>
            <strong>Every day is either hard or easy.</strong> Full speed, or genuinely relaxed. The medium pace in
            between gives you all the tiredness of hard training and almost none of the improvement.
          </li>
          <li>
            <strong>Never two hard days in a row.</strong> Three a week at most. During the season a meet counts as one
            of them.
          </li>
        </ol>
      </section>

      {coach && <LogoSlot logo={logo} setLogo={setLogo} />}
    </div>
  );
}

/* ---------- logo slot ---------- */
function readLogoFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("not an image"));
      img.onload = () => {
        const max = 256;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function LogoSlot({ logo, setLogo }) {
  const [err, setErr] = useState("");
  const onPick = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setErr("");
    try {
      const url = await readLogoFile(file);
      setLogo(url);
      store.set(LOGO_KEY, url, true);
    } catch (_) {
      setErr("That file didn't load. Try a PNG or JPG.");
    }
  };
  return (
    <section className="panel panel-coach">
      <h3 className="h-sec">Team logo</h3>
      <div className="logo-slot">
        {logo && (
          <div className="logo-preview">
            <Crest logo={logo} size={52} />
          </div>
        )}
        <div className="logo-copy">
          <p className="body">
            {logo ? "The Panthers mark shows in the header on every phone." : "Load the Panthers mark and it shows in the header on every phone."}
          </p>
          <div className="logo-actions">
            <label className="btn btn-sm">
              {logo ? "Replace logo" : "Choose logo file"}
              <input type="file" accept="image/*" onChange={onPick} className="hide-input" />
            </label>
            {logo && (
              <button
                className="btn-ghost"
                onClick={() => {
                  setLogo(null);
                  store.set(LOGO_KEY, null, true);
                }}
              >
                Remove
              </button>
            )}
          </div>
          {err && <p className="note">{err}</p>}
        </div>
      </div>
      <p className="fine">A PNG with a transparent background sits best on the purple header.</p>
    </section>
  );
}

/* ---------- Times ---------- */
function Times({ event }) {
  const [log, setLog] = useState([]);
  const [ready, setReady] = useState(false);
  const [ev, setEv] = useState(event);
  const [val, setVal] = useState("");

  useEffect(() => {
    (async () => {
      const saved = await store.get(LOG_KEY);
      setLog(Array.isArray(saved) ? saved : []);
      setReady(true);
    })();
  }, []);
  useEffect(() => setEv(event), [event]);

  const save = (next) => {
    setLog(next);
    store.set(LOG_KEY, next);
  };
  const add = () => {
    const t = parseTime(val);
    if (t == null) return;
    save([{ id: Date.now(), ev, t, date: new Date().toISOString().slice(0, 10) }, ...log]);
    setVal("");
  };

  const labelFor = (id) =>
    ({ fly10: "Fly 10", fly20: "Fly 20", e60: "60m", e100: "100m", e200: "200m", e400: "400m" }[id] || id);
  const best = {};
  log.forEach((e) => {
    if (best[e.ev] == null || e.t < best[e.ev]) best[e.ev] = e.t;
  });
  const pr100 = best.e100;

  return (
    <div className="stack">
      <section className="panel panel-purple">
        <h3 className="h-sec h-on-purple">Your best times</h3>
        {Object.keys(best).length === 0 ? (
          <p className="empty">Add a time below and it shows up here. Time everything — what gets timed gets faster.</p>
        ) : (
          <div className="pr-grid">
            {["fly10", "fly20", "e60", "e100", "e200", "e400"]
              .filter((k) => best[k] != null)
              .map((k) => (
                <div key={k} className="pr">
                  <span className="pr-n">{fmtTime(best[k])}</span>
                  <span className="pr-l">{labelFor(k)}</span>
                </div>
              ))}
          </div>
        )}
        <p className="fine fine-on-purple">These stay on your phone. Nobody else sees them.</p>
      </section>

      <section className="panel">
        <h3 className="h-sec">Add a time</h3>
        <div className="chips">
          {["fly10", "fly20", "e60", "e100", "e200", "e400"].map((k) => (
            <button key={k} className={`chip ${ev === k ? "on" : ""}`} onClick={() => setEv(k)}>
              {labelFor(k)}
            </button>
          ))}
        </div>
        <div className="add-row">
          <input
            className="input"
            inputMode="decimal"
            placeholder="11.42 or 1:02.7"
            value={val}
            onChange={(e) => setVal(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && add()}
          />
          <button className="btn" onClick={add}>
            Save
          </button>
        </div>
      </section>

      {pr100 && (
        <section className="panel">
          <h3 className="h-sec">Your easy-day pace</h3>
          <p className="big">
            {(pr100 * 1.33).toFixed(1)} to {(pr100 * 1.43).toFixed(1)} seconds
          </p>
          <p className="body">
            That's what a 100 on the grass should take on an easy day, based on your {fmtTime(pr100)}. Run them faster
            than this and the easy day stops doing its job.
          </p>
        </section>
      )}

      <section className="panel">
        <h3 className="h-sec">Everything you've logged</h3>
        {!ready ? (
          <p className="empty">Loading…</p>
        ) : log.length === 0 ? (
          <p className="empty">Nothing yet.</p>
        ) : (
          <ul className="log">
            {log.map((e) => (
              <li key={e.id}>
                <span className="log-ev">{labelFor(e.ev)}</span>
                <span className="log-t">
                  {fmtTime(e.t)}
                  {best[e.ev] === e.t && <em className="pr-badge">Best</em>}
                </span>
                <span className="log-d">{e.date}</span>
                <button className="x" onClick={() => save(log.filter((x) => x.id !== e.id))} aria-label="Delete">
                  ×
                </button>
              </li>
            ))}
          </ul>
        )}
      </section>
    </div>
  );
}

/* ---------- Race ---------- */
function Race({ event }) {
  const [goal, setGoal] = useState("");
  const g = parseTime(goal);
  const marks = SPLIT_MODEL[event];
  const ev = EVENTS.find((e) => e.id === event);

  return (
    <div className="stack">
      <section className="panel panel-purple">
        <h3 className="h-sec h-on-purple">Your {ev.full} plan</h3>
        <input
          className="input input-dark"
          inputMode="decimal"
          placeholder={event === "e400" ? "Goal time, like 50.5" : "Goal time, like 11.20"}
          value={goal}
          onChange={(e) => setGoal(e.target.value)}
        />
        <p className="hero-sub">Put in the time you're chasing and the splits fill in.</p>
      </section>

      <section className="panel">
        <h3 className="h-sec">How it should feel, mark by mark</h3>
        <div className="splits">
          {marks.map((m, idx) => {
            const c = g ? g * m.f : null;
            const prev = idx === 0 || !g ? 0 : g * marks[idx - 1].f;
            return (
              <div key={m.at} className="split">
                <div className="split-head">
                  <span className="split-at">{m.at}</span>
                  <span className="split-t">{c ? c.toFixed(2) : "—"}</span>
                </div>
                {c && <span className="split-seg">that piece on its own: {(c - prev).toFixed(2)}</span>}
                <p className="split-cue">{m.cue}</p>
              </div>
            );
          })}
        </div>
      </section>

      {event === "e400" && g && (
        <section className="panel panel-outline">
          <h3 className="h-sec">Your two halves</h3>
          <p className="big">
            {(g * 0.476).toFixed(2)} / {(g - g * 0.476).toFixed(2)}
          </p>
          <p className="body">
            First 200 and second 200. About two to two and a half seconds between them is a well-run race. Closer than
            that and you left time out there on the first half. Further apart and you went out too hard and paid for it
            coming home.
          </p>
        </section>
      )}

      <section className="panel">
        <h3 className="h-sec">The last ten days before a big meet</h3>
        <ol className="rules">
          <li>
            <strong>Ten to seven days out:</strong> your last genuinely hard session. Nothing after this makes you fitter
            by race day.
          </li>
          <li>
            <strong>Five to four days out:</strong> the last full-speed running. Short, sharp, timed.
          </li>
          <li>
            <strong>You'll do a lot less</strong> over these ten days, but what you do is still fast. Feeling slightly
            under-worked beats feeling fit and flat.
          </li>
          <li>
            <strong>Nothing new.</strong> No new lift, no new drill, no new spikes, no new warmup.
          </li>
          <li>
            <strong>No weight room inside three or four days.</strong>
          </li>
        </ol>
      </section>

      <section className="panel">
        <h3 className="h-sec">Meet-day warmup</h3>
        <p className="body">{WARM.meet}</p>
      </section>
    </div>
  );
}

const TABS = [
  { id: "today", label: "Today" },
  { id: "week", label: "Week" },
  { id: "times", label: "Times" },
  { id: "race", label: "Race" },
];

function App() {
  const [tab, setTab] = useState("today");
  const [event, setEvent] = useState("e100");
  const [coach, setCoach] = useState(false);
  const [logo, setLogo] = useState(null);
  const [board, setBoard] = useState({ phase: "comp", plan: TEMPLATES.comp, notes: ["", "", "", "", "", "", ""] });
  const [loaded, setLoaded] = useState(false);

  const loadBoard = useCallback(async () => {
    const b = await store.get(BOARD_KEY, true);
    if (b && Array.isArray(b.plan) && b.plan.length === 7) setBoard(b);
    const l = await store.get(LOGO_KEY, true);
    if (typeof l === "string" && l.startsWith("data:image")) setLogo(l);
    setLoaded(true);
  }, []);

  useEffect(() => {
    loadBoard();
  }, [loadBoard]);
  useEffect(() => {
    if (loaded && tab === "today") loadBoard();
  }, [tab]); // eslint-disable-line

  useEffect(() => {
    (async () => {
      const e = await store.get("panther:event:v2");
      if (e) setEvent(e);
    })();
  }, []);
  useEffect(() => {
    store.set("panther:event:v2", event);
  }, [event]);

  const push = (next) => {
    setBoard(next);
    store.set(BOARD_KEY, next, true);
  };
  const setDay = (i, id) => {
    const plan = [...board.plan];
    plan[i] = id;
    push({ ...board, plan });
  };
  const setNote = (i, text) => {
    const notes = [...board.notes];
    notes[i] = text;
    push({ ...board, notes });
  };
  const setPhase = (phase) => push({ ...board, phase });
  const resetWeek = () =>
    push({ ...board, plan: defaultWeek(event, board.phase), notes: ["", "", "", "", "", "", ""] });

  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="top">
        <div className="brand">
          <Crest logo={logo} />
          <span className="brand-text">
            <span className="brand-name">Panther Speed</span>
            <span className="brand-sub">Wenatchee High School Track &amp; Field</span>
          </span>
          <button
            className={`coach-toggle ${coach ? "on" : ""}`}
            onClick={() => setCoach(!coach)}
            aria-pressed={coach}
          >
            Coach
          </button>
        </div>
        <div className="events">
          {EVENTS.map((e) => (
            <button key={e.id} className={`event ${event === e.id ? "on" : ""}`} onClick={() => setEvent(e.id)}>
              {e.label}
            </button>
          ))}
        </div>
      </header>

      <main className="main">
        {tab === "today" && (
          <Today board={board} event={event} coach={coach} setDay={setDay} setNote={setNote} />
        )}
        {tab === "week" && (
          <Week
            board={board}
            event={event}
            coach={coach}
            setDay={setDay}
            setNote={setNote}
            setPhase={setPhase}
            resetWeek={resetWeek}
            logo={logo}
            setLogo={setLogo}
          />
        )}
        {tab === "times" && <Times event={event} />}
        {tab === "race" && <Race event={event} />}
      </main>

      <nav className="nav">
        {TABS.map((t) => (
          <button key={t.id} className={tab === t.id ? "on" : ""} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

.lane-track { position: relative; height: 20px; margin: 9px 0 6px; background: var(--chalk); border-radius: 2px; display: flex; align-items: center; }
.lane-fill { display: block; height: 100%; background: var(--purple); border-radius: 2px; }
.lane-dist { position: absolute; right: 8px; font-family: var(--display); font-size: 12px; letter-spacing: .08em; color: var(--purple); font-weight: 600; }
.lane-rest { font-size: 12px; color: var(--mist); }
.volume { display: flex; align-items: baseline; gap: 9px; margin-top: 14px; padding-top: 13px; border-top: 2px solid var(--gold); }
.volume-n { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; color: var(--purple); }
.volume-l { font-size: 12.5px; color: var(--mist); }
.volume-low .volume-n { color: var(--mist); }

.list { list-style: none; display: flex; flex-direction: column; gap: 11px; }
.list li { font-size: 14px; line-height: 1.6; color: #33203F; padding-left: 14px; border-left: 2px solid var(--gold); }
.rules { list-style: none; counter-reset: r; display: flex; flex-direction: column; gap: 12px; }
.rules li { counter-increment: r; font-size: 14px; line-height: 1.6; color: #33203F; position: relative; padding-left: 26px; }
.rules li::before { content: counter(r); position: absolute; left: 0; top: 1px; font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--gold-deep); }
.rules strong { color: var(--ink); }

/* week */
.week { display: flex; flex-direction: column; }
.day { border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day-main {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  border: 0; background: none; padding: 13px 0; font-family: var(--body); cursor: pointer;
}
.day-main:disabled { cursor: default; }
.day-today { background: linear-gradient(to right, #FBF6DE, transparent 70%); }
.day-name { flex: 0 0 44px; font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .05em; color: var(--ink); }
.day-today .day-name { color: var(--gold-deep); }
.day-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.day-title { font-size: 14.5px; color: #33203F; }
.day-note { font-size: 12.5px; color: var(--mist); margin-top: 3px; }
.day-kind { flex: 0 0 auto; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px; margin-top: 1px; }
.day-hard .day-kind { background: var(--purple); color: #fff; }
.day-easy .day-kind { background: #EFE4F3; color: var(--purple); }
.day-meet .day-kind { background: var(--gold); color: var(--ink); }
.day-light .day-kind { background: #FBF0CE; color: var(--gold-deep); }
.day-off .day-kind { background: var(--chalk); color: var(--mist); }
.day-off .day-title { color: var(--mist); }
.day-edit { padding: 0 0 14px; }

.phases { display: flex; flex-direction: column; gap: 5px; }
.phase {
  display: flex; justify-content: space-between; align-items: baseline; border: 1px solid var(--line);
  background: var(--chalk); cursor: pointer; padding: 10px 12px; border-radius: 3px;
  text-align: left; font-family: var(--body);
}
.phase.on { background: var(--purple); border-color: var(--purple); }
.phase-l { font-size: 14px; font-weight: 500; color: var(--ink); }
.phase.on .phase-l { color: #fff; }
.phase-w { font-size: 11.5px; color: var(--mist); }
.phase.on .phase-w { color: var(--gold); }

/* logo slot */
.logo-slot { display: flex; gap: 14px; align-items: flex-start; }
.logo-preview {
  flex: 0 0 64px; height: 64px; display: flex; align-items: center; justify-content: center;
  background: var(--purple-2); border-radius: 3px; padding: 6px;
}
.logo-copy { flex: 1; min-width: 0; }
.logo-actions { display: flex; align-items: center; gap: 12px; margin-top: 11px; }

/* times */
.pr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; }
.pr { display: flex; flex-direction: column; }
.pr-n { font-family: var(--display); font-size: 25px; font-weight: 600; color: var(--gold); line-height: 1; }
.pr-l { font-size: 11px; color: #C3A7D6; margin-top: 4px; letter-spacing: .04em; }
.big { font-family: var(--display); font-size: 36px; font-weight: 700; color: var(--purple); line-height: 1; margin-bottom: 10px; }
.log { list-style: none; display: flex; flex-direction: column; }
.log li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; padding-top: 0; }
.log-ev { flex: 0 0 58px; font-size: 12.5px; color: var(--mist); }
.log-t { flex: 1; font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: .03em; }
.pr-badge {
  font-family: var(--body); font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .06em;
  background: var(--gold); color: var(--ink); padding: 2px 5px; border-radius: 2px; margin-left: 8px; vertical-align: 3px;
}
.log-d { font-size: 12px; color: var(--mist); }
.x { border: 0; background: none; color: #B5A3C1; font-size: 20px; cursor: pointer; padding: 0 2px; line-height: 1; }

/* race */
.splits { display: flex; flex-direction: column; }
.split { padding: 13px 0; border-top: 1px solid var(--line); }
.split:first-child { border-top: 0; padding-top: 0; }
.split-head { display: flex; align-items: baseline; justify-content: space-between; }
.split-at { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--purple); }
.split-t { font-family: var(--display); font-size: 27px; font-weight: 700; color: var(--ink); line-height: 1; }
.split-seg { display: block; font-size: 11.5px; color: var(--mist); margin-top: 3px; }
.split-cue { font-size: 14px; line-height: 1.55; color: #33203F; margin-top: 7px; }

/* nav */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
  display: grid; grid-template-columns: repeat(4, 1fr); background: var(--ink);
  border-top: 2px solid var(--gold); z-index: 30;
}
.nav button {
  border: 0; background: none; cursor: pointer; padding: 15px 0 17px; font-family: var(--display);
  font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: #9C87AD; border-top: 3px solid transparent; margin-top: -3px;
}
.nav button.on { color: var(--gold); border-top-color: var(--gold); }

@media (prefers-reduced-motion: reduce) { .app * { transition: none !important; animation: none !important; } }
`;


/* ---------- start the app ---------- */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
